
name: Build EGOIST Client

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP was found."
            echo "Upload EGOIST-26.2-GITHUB-READY.zip to the repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p /tmp/egoist-extracted
          unzip -o "$ZIP_FILE" -d /tmp/egoist-extracted

          BUILD_FILE=$(find /tmp/egoist-extracted -name build.gradle -type f | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle was not found inside the ZIP."
            find /tmp/egoist-extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Project located at: $PROJECT_DIR"
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 5 -type f

          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"

          if [ ! -d "$GITHUB_WORKSPACE/src" ]; then
            echo "ERROR: src folder is missing after extraction."
            exit 1
          fi

          echo "Project successfully extracted."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build EGOIST
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EGOIST-Build-Files
          path: |
            build/libs/*.jar
            build-log.txt
          if-no-files-found: warn
