
name: Build EGOIST Client

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          mkdir -p /tmp/egoist-extracted
          unzip -o "$ZIP_FILE" -d /tmp/egoist-extracted

          BUILD_FILE=$(find /tmp/egoist-extracted -name build.gradle -type f | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"

          if [ ! -d "$GITHUB_WORKSPACE/src" ]; then
            echo "ERROR: src directory missing."
            exit 1
          fi

          echo "Project extracted successfully."

      - name: Fix Gradle repository conflict
        shell: bash
        run: |
          set -e

          if [ -f settings.gradle ]; then
            sed -i 's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle
          fi

          if [ -f settings.gradle.kts ]; then
            sed -i 's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle.kts
          fi

          echo "Repository conflict fix applied."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build EGOIST
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EGOIST-Build-Files
          path: |
            build/libs/*.jar
            build-log.txt
          if-no-files-found: warn
