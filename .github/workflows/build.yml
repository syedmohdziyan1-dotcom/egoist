
name: Build EGOIST Client

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Check project files
        shell: bash
        run: |
          echo "Checking project structure..."

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "::error::Missing build.gradle or build.gradle.kts"
            echo "The repository root does not contain a Gradle project."
            exit 1
          fi

          if [ ! -f gradlew ]; then
            echo "::error::Missing Gradle wrapper (gradlew)"
            exit 1
          fi

          if [ ! -d src ]; then
            echo "::error::Missing src directory"
            exit 1
          fi

          echo "Project structure check passed."

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile EGOIST Client
        id: build
        shell: bash
        run: |
          set +e

          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          exit "$BUILD_EXIT"

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          echo "## EGOIST Build Diagnosis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f build.log ]; then
            echo "Build log was not generated." >> "$GITHUB_STEP_SUMMARY"
            echo "The failure may have occurred before compilation started." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -qiE "cannot find symbol|symbol:|error: " build.log; then
            echo "### Java compilation error" >> "$GITHUB_STEP_SUMMARY"
            echo "Check missing classes, imports, API methods or incompatible code." >> "$GITHUB_STEP_SUMMARY"

          elif grep -qiE "Could not resolve|Could not find|dependency.*failed" build.log; then
            echo "### Dependency resolution error" >> "$GITHUB_STEP_SUMMARY"
            echo "Check dependencies, repositories and version compatibility." >> "$GITHUB_STEP_SUMMARY"

          elif grep -qiE "Plugin .* was not found|UnknownPluginException" build.log; then
            echo "### Gradle plugin error" >> "$GITHUB_STEP_SUMMARY"
            echo "Check plugin versions and plugin repositories." >> "$GITHUB_STEP_SUMMARY"

          elif grep -qiE "Unsupported class file|UnsupportedClassVersionError|requires JVM|invalid source release" build.log; then
            echo "### Java version error" >> "$GITHUB_STEP_SUMMARY"
            echo "Check Java and Gradle compatibility." >> "$GITHUB_STEP_SUMMARY"

          elif grep -qiE "fabric-loom|loom|fabric.*failed" build.log; then
            echo "### Fabric configuration error" >> "$GITHUB_STEP_SUMMARY"
            echo "Check Fabric Loom and Minecraft dependency configuration." >> "$GITHUB_STEP_SUMMARY"

          else
            echo "### Unknown build error" >> "$GITHUB_STEP_SUMMARY"
            echo "Inspect the log below for the actual error." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Last 100 build log lines" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: egoist-build-diagnostics
          path: build.log
          if-no-files-found: warn

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EGOIST-Client-26.2
          path: build/libs/*.jar
          if-no-files-found: error
