name: Build EGOIST Client

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile EGOIST Client
        id: build
        shell: bash
        run: |
          set +e

          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]

          }
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          exit $BUILD_EXIT

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          echo "## EGOIST Build Diagnosis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f build.log ]; then
            echo "Build log was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -qiE "cannot find symbol|symbol:|error: " build.log; then
            echo "### Java compilation error" >> "$GITHUB_STEP_SUMMARY"
            echo "Likely a missing class, incorrect method, invalid API or Java source error." >> "$GITHUB_STEP_SUMMARY"

          elif grep -qiE "Could not resolve|Could not find|dependency.*failed" build.log; then
            echo "### Dependency resolution error" >> "$GITHUB_STEP_SUMMARY"
            echo "Check dependencies, repositories and version compatibility." >> "$GITHUB_STEP_SUMMARY"

          elif grep -qiE "Plugin .* was not found|UnknownPluginException" build.log; then
            echo "### Gradle plugin error" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the Gradle plugin version and plugin repositories." >> "$GITHUB_STEP_SUMMARY"

          elif grep -qiE "Unsupported class file|UnsupportedClassVersionError|requires JVM" build.log; then
            echo "### Java version error" >> "$GITHUB_STEP_SUMMARY"
            echo "Check Java and Gradle compatibility." >> "$GITHUB_STEP_SUMMARY"

          elif grep -qiE "Could not resolve.*fabric|fabric-loom|loom" build.log; then
            echo "### Fabric Loom error" >> "$GITHUB_STEP_SUMMARY"
            echo "Check Fabric Loom configuration and Minecraft dependencies." >> "$GITHUB_STEP_SUMMARY"

          else
            echo "### Unknown build error" >> "$GITHUB_STEP_SUMMARY"
            echo "The error did not match the known patterns. Inspect the log below." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Last 100 build log lines" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: egoist-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EGOIST-Client-26.2
          path: build/libs/*.jar
          if-no-files-found: error
