name: Build EGOIST Client

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Check project files
        shell: bash
        run: |
          set -e
          test -f build.gradle || test -f build.gradle.kts || { echo '::error::Missing Gradle build file'; exit 1; }
          test -d src || { echo '::error::Missing src directory'; exit 1; }
          echo 'Project files found.'

      - name: Build and capture log
        id: compile
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          exit "$BUILD_EXIT"

      - name: Diagnose failure
        if: failure()
        shell: bash
        run: |
          {
            echo '## EGOIST build diagnosis'
            echo
            if [ ! -f build.log ]; then
              echo 'Build log is missing; failure may have occurred before Gradle compilation.'
            else
              if grep -Eqi 'cannot find symbol|symbol:|error: ' build.log; then
                echo '- Java compilation/API error: inspect missing symbols, imports, or API signatures.'
              fi
              if grep -Eqi 'Could not resolve|Could not find|UnknownHostException|Connection timed out' build.log; then
                echo '- Dependency/network error: check repository access and dependency versions.'
              fi
              if grep -Eqi 'Plugin .* was not found|UnknownPluginException' build.log; then
                echo '- Gradle plugin error: check plugin repositories and plugin versions.'
              fi
              if grep -Eqi 'Unsupported class file|UnsupportedClassVersionError|invalid source release|requires JVM' build.log; then
                echo '- Java/toolchain mismatch: verify Java 25 and Gradle compatibility.'
              fi
              if grep -Eqi 'fabric-loom|loom' build.log; then
                echo '- Fabric Loom configuration/compatibility may be involved.'
              fi
              echo
              echo '### Last 120 log lines'
              echo '```text'
              tail -n 120 build.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: egoist-build-diagnostics
          path: build.log
          if-no-files-found: warn

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EGOIST-Client-26.2
          path: build/libs/*.jar
          if-no-files-found: error
